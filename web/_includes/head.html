<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ page.description | default: site.description }}" />
<title>{{ page.title | default: site.title }}</title>
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}" />
<link rel="shortcut icon" href="{{ '/favicon.svg' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />

<!-- Open Graph -->
{% if page.layout == 'post' %}
<meta property="og:type" content="article" />
{% else %}
<meta property="og:type" content="website" />
{% endif %}
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
{% assign share_image = page.social_image | default: site.social_image %}
{% if share_image contains '://' %}
<meta property="og:image" content="{{ share_image }}" />
{% else %}
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}{{ share_image }}" />
{% endif %}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@{{ site.twitter_username }}" />
<meta name="twitter:creator" content="@{{ site.twitter_username }}" />
<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
<meta name="twitter:description" content="{{ page.description | default: site.description }}" />
{% if share_image contains '://' %}
<meta name="twitter:image" content="{{ share_image }}" />
{% else %}
<meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}{{ share_image }}" />
{% endif %}
