version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Jekyll (Ruby)
  - package-ecosystem: "bundler"
    directory: "/web"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Python data pipelines
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
